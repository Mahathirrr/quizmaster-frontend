<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
      <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#818CF8"/>
          <stop offset="100%" stop-color="#4F46E5"/>
        </linearGradient>
        <linearGradient id="avatar1" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#FFFFFF"/>
          <stop offset="100%" stop-color="#E0E7FF"/>
        </linearGradient>
        <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FDE047"/>
          <stop offset="100%" stop-color="#D97706"/>
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#312E81" flood-opacity="0.25"/>
        </filter>
      </defs>
      <!-- Base Shield / Squircle -->
      <rect x="48" y="48" width="416" height="416" rx="100" fill="url(#bg)" filter="url(#shadow)"/>
      <rect x="48" y="48" width="416" height="416" rx="100" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"/>
      <path d="M 120 54 L 392 54 Q 458 54 458 120 L 458 135 Q 458 60 392 60 L 120 60 Q 54 60 54 135 L 54 120 Q 54 54 120 54 Z" fill="#FFFFFF" fill-opacity="0.3"/>
      
      <!-- Center Student Avatar -->
      <g filter="url(#shadow)">
        <circle cx="256" cy="190" r="64" fill="url(#avatar1)"/>
        <!-- Scholar Cap on Center Avatar -->
        <polygon points="256,100 180,135 256,170 332,135" fill="url(#gold)"/>
        <line x1="330" y1="135" x2="330" y2="175" stroke="#F59E0B" stroke-width="8" stroke-linecap="round"/>
        <circle cx="330" cy="180" r="8" fill="#F59E0B"/>
        <!-- Body -->
        <path d="M 160 350 C 160 270 352 270 352 350 Z" fill="url(#avatar1)"/>
      </g>
      
      <!-- Left Companion Avatar -->
      <circle cx="150" cy="220" r="44" fill="#C7D2FE" opacity="0.9"/>
      <path d="M 80 340 C 80 280 220 280 220 340 Z" fill="#C7D2FE" opacity="0.9"/>
      
      <!-- Right Companion Avatar -->
      <circle cx="362" cy="220" r="44" fill="#C7D2FE" opacity="0.9"/>
      <path d="M 292 340 C 292 280 432 280 432 340 Z" fill="#C7D2FE" opacity="0.9"/>
      
      <!-- Sparkle Badge -->
      <circle cx="390" cy="110" r="38" fill="url(#gold)" stroke="#FFFFFF" stroke-width="6" filter="url(#shadow)"/>
      <path d="M 390 88 L 394 104 L 410 110 L 394 116 L 390 132 L 386 116 L 370 110 L 386 104 Z" fill="#FFFFFF"/>
    </svg>