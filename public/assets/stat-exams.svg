<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
      <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#34D399"/>
          <stop offset="100%" stop-color="#059669"/>
        </linearGradient>
        <linearGradient id="paper" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#FFFFFF"/>
          <stop offset="100%" stop-color="#F3F4F6"/>
        </linearGradient>
        <linearGradient id="pencil" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FBBF24"/>
          <stop offset="100%" stop-color="#D97706"/>
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#064E3B" flood-opacity="0.25"/>
        </filter>
      </defs>
      <rect x="48" y="48" width="416" height="416" rx="100" fill="url(#bg)" filter="url(#shadow)"/>
      <rect x="48" y="48" width="416" height="416" rx="100" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"/>
      <path d="M 120 54 L 392 54 Q 458 54 458 120 L 458 135 Q 458 60 392 60 L 120 60 Q 54 60 54 135 L 54 120 Q 54 54 120 54 Z" fill="#FFFFFF" fill-opacity="0.3"/>
      
      <!-- Exam Paper -->
      <g filter="url(#shadow)">
        <rect x="136" y="110" width="240" height="292" rx="28" fill="url(#paper)"/>
        <!-- Checklist Lines -->
        <!-- Line 1 with Checkmark -->
        <circle cx="180" cy="175" r="16" fill="#10B981"/>
        <path d="M 172 175 L 178 181 L 189 169" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="210" y="168" width="130" height="14" rx="7" fill="#E5E7EB"/>

        <!-- Line 2 with Checkmark -->
        <circle cx="180" cy="235" r="16" fill="#10B981"/>
        <path d="M 172 235 L 178 241 L 189 229" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="210" y="228" width="110" height="14" rx="7" fill="#E5E7EB"/>

        <!-- Line 3 with Checkmark -->
        <circle cx="180" cy="295" r="16" fill="#10B981"/>
        <path d="M 172 295 L 178 301 L 189 289" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="210" y="288" width="120" height="14" rx="7" fill="#E5E7EB"/>

        <!-- Line 4 Progress bar -->
        <rect x="164" y="350" width="184" height="18" rx="9" fill="#E5E7EB"/>
        <rect x="164" y="350" width="140" height="18" rx="9" fill="#10B981"/>
      </g>
      
      <!-- 3D Pencil across corner -->
      <g transform="rotate(35 340 320)" filter="url(#shadow)">
        <rect x="300" y="240" width="40" height="140" rx="8" fill="url(#pencil)"/>
        <polygon points="300,380 340,380 320,420" fill="#FDE68A"/>
        <polygon points="314,408 326,408 320,420" fill="#1F2937"/>
        <rect x="300" y="224" width="40" height="24" rx="6" fill="#F43F5E"/>
        <rect x="300" y="244" width="40" height="8" fill="#D1D5DB"/>
      </g>
    </svg>