<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
      <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FBBF24"/>
          <stop offset="100%" stop-color="#D97706"/>
        </linearGradient>
        <linearGradient id="bulb" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#FFFFFF"/>
          <stop offset="40%" stop-color="#FEF08A"/>
          <stop offset="100%" stop-color="#F59E0B"/>
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#78350F" flood-opacity="0.25"/>
        </filter>
        <filter id="glow">
          <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
          <feMerge>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
      <rect x="48" y="48" width="416" height="416" rx="100" fill="url(#bg)" filter="url(#shadow)"/>
      <rect x="48" y="48" width="416" height="416" rx="100" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"/>
      <path d="M 120 54 L 392 54 Q 458 54 458 120 L 458 135 Q 458 60 392 60 L 120 60 Q 54 60 54 135 L 54 120 Q 54 54 120 54 Z" fill="#FFFFFF" fill-opacity="0.3"/>
      
      <!-- Big Glowing Idea Lightbulb -->
      <g filter="url(#shadow)">
        <path d="M 256 120 C 196 120 160 166 160 216 C 160 254 186 288 206 312 L 206 340 C 206 346 212 350 218 350 L 294 350 C 300 350 306 346 306 340 L 306 312 C 326 288 352 254 352 216 C 352 166 316 120 256 120 Z" fill="url(#bulb)"/>
        <!-- Bulb Base Screw Threads -->
        <rect x="220" y="356" width="72" height="14" rx="6" fill="#E5E7EB"/>
        <rect x="226" y="374" width="60" height="14" rx="6" fill="#9CA3AF"/>
        <ellipse cx="256" cy="392" rx="18" ry="6" fill="#374151"/>
        <!-- Filament Glowing Spark -->
        <path d="M 234 230 C 234 200 256 186 256 186 C 256 186 278 200 278 230" stroke="#FFFFFF" stroke-width="12" fill="none" stroke-linecap="round"/>
        <!-- Sparkle Rays -->
        <line x1="256" y1="86" x2="256" y2="60" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
        <line x1="140" y1="130" x2="116" y2="114" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
        <line x1="372" y1="130" x2="396" y2="114" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
        <line x1="100" y1="216" x2="72" y2="216" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
        <line x1="412" y1="216" x2="440" y2="216" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
      </g>
    </svg>