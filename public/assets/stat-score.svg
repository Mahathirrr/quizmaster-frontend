<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
      <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FB7185"/>
          <stop offset="100%" stop-color="#E11D48"/>
        </linearGradient>
        <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FEF08A"/>
          <stop offset="50%" stop-color="#F59E0B"/>
          <stop offset="100%" stop-color="#B45309"/>
        </linearGradient>
        <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#FFFBEB"/>
          <stop offset="100%" stop-color="#FBBF24"/>
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#881337" flood-opacity="0.25"/>
        </filter>
      </defs>
      <rect x="48" y="48" width="416" height="416" rx="100" fill="url(#bg)" filter="url(#shadow)"/>
      <rect x="48" y="48" width="416" height="416" rx="100" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"/>
      <path d="M 120 54 L 392 54 Q 458 54 458 120 L 458 135 Q 458 60 392 60 L 120 60 Q 54 60 54 135 L 54 120 Q 54 54 120 54 Z" fill="#FFFFFF" fill-opacity="0.3"/>
      
      <!-- Trophy -->
      <g filter="url(#shadow)">
        <!-- Handles -->
        <path d="M 160 170 C 100 170 100 250 170 260" stroke="url(#gold)" stroke-width="26" fill="none" stroke-linecap="round"/>
        <path d="M 352 170 C 412 170 412 250 342 260" stroke="url(#gold)" stroke-width="26" fill="none" stroke-linecap="round"/>
        <!-- Main Cup Body -->
        <path d="M 160 140 L 352 140 C 352 250 310 280 256 280 C 202 280 160 250 160 140 Z" fill="url(#gold)"/>
        <!-- Rim -->
        <ellipse cx="256" cy="140" rx="96" ry="24" fill="url(#goldLight)"/>
        <!-- Embossed Star in Trophy Center -->
        <polygon points="256,180 264,204 290,204 269,218 277,242 256,228 235,242 243,218 222,204 248,204" fill="#FFFFFF"/>
        <!-- Stem -->
        <rect x="238" y="280" width="36" height="44" rx="6" fill="url(#gold)"/>
        <!-- Base Stand -->
        <path d="M 200 324 L 312 324 L 324 370 L 188 370 Z" fill="url(#gold)"/>
        <rect x="174" y="370" width="164" height="26" rx="8" fill="#FFFBEB"/>
      </g>
    </svg>